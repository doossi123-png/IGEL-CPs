<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b70"><link rel="manifest" href="manifest.json"><title>TOEIC 850 MASTER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#123b70;color:white;padding:22px 18px 18px}h1{font-size:22px;margin:0 0 5px}header p{margin:0;opacity:.85;font-size:13px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #102b5010}h2{font-size:17px;margin:0 0 12px}.muted{color:#66758c;font-size:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #d5deea;border-radius:10px;padding:10px;background:white;color:#17243a}button{background:#123b70;color:white;border:0;font-weight:600}button.secondary{background:#eaf0f8;color:#123b70}input[type=checkbox]{width:19px;height:19px}label.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f5}.bar{height:9px;background:#e6ebf2;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#2474c6;width:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid button{padding:13px 7px}.stat{font-size:23px;font-weight:750}.full{width:100%}textarea{width:100%;min-height:70px;border:1px solid #d5deea;border-radius:10px;padding:10px;font:inherit}
</style></head><body><header><h1>TOEIC 850 MASTER</h1><p>9개월 목표 학습 트래커 · 근무주기 맞춤</p></header><main class="wrap">
<section class="card"><h2>오늘의 학습</h2><div class="row"><input id="day" type="date"><span class="muted" id="cycle"></span></div><p class="muted">완료한 항목을 체크하면 이 기기에 자동 저장됩니다.</p><div id="tasks"></div><div class="bar"><span id="progress"></span></div><p class="muted" id="pct">진도 0%</p></section>
<section class="card"><h2>학습 타이머</h2><div class="row"><select id="subject"><option>영단어</option><option>문법</option><option>LC</option><option>RC</option><option>복습</option><option>자유학습</option></select><strong id="clock" class="stat">00:00</strong></div><div class="row" style="margin-top:10px"><button id="start">시작</button><button class="secondary" id="stop">정지 및 기록</button></div><p class="muted" id="total"></p></section>
<section class="card"><h2>9개월 학습 로드맵</h2><div id="roadmap"></div></section>
<section class="card"><h2>모의고사 점수 기록</h2><div class="row"><input id="testdate" type="date"><input id="lc" type="number" min="0" max="495" placeholder="LC 점수" style="width:110px"><input id="rc" type="number" min="0" max="495" placeholder="RC 점수" style="width:110px"><button id="saveScore">기록</button></div><div id="scores" class="muted"></div></section>
<section class="card"><h2>데이터 백업</h2><div class="row"><button id="export">백업 내보내기</button><label class="secondary" style="padding:10px;border-radius:10px">복원하기 <input id="import" type="file" accept="application/json" hidden></label></div><p class="muted">기록은 현재 브라우저에 저장됩니다. 기기 변경 전 백업을 내려받으세요.</p></section>
</main><script>
const $=id=>document.getElementById(id), startDate=new Date('2026-11-27T00:00:00'), tasksBy=['단어 20~30개 암기','LC 집중 학습','RC 문법·독해','오답 및 복습'];
let db=JSON.parse(localStorage.getItem('toeic850db')||'{}'), running=null, secs=0, timer=null;
function save(){localStorage.setItem('toeic850db',JSON.stringify(db));render()}
function key(){return $('day').value}
function cycleInfo(d){let x=new Date(d+'T00:00:00'), n=Math.floor((x-startDate)/86400000);if(n<0)return '기초 적응 기간';let i=((n%9)+9)%9;return ['주간 1일차','주간 2일차','주간 3일차','야간 1일차','비번','야간 2일차','비번','야간 3일차','비번'][i]}
function render(){let k=key(), arr=db.tasks?.[k]||[];$('cycle').textContent=cycleInfo(k);$('tasks').innerHTML=tasksBy.map((t,i)=>`<label class="task"><input type="checkbox" data-i="${i}" ${arr.includes(i)?'checked':''}>${t}</label>`).join('');let p=Math.round(arr.length/4*100);$('progress').style.width=p+'%';$('pct').textContent='진도 '+p+'%';let total=Object.values(db.minutes||{}).reduce((a,b)=>a+b,0);$('total').textContent='누적 학습 '+Math.floor(total/60)+'시간 '+total%60+'분';$('roadmap').innerHTML=Array.from({length:9},(_,i)=>`<label class="task"><input type="checkbox" data-month="${i}" ${db.months?.includes(i)?'checked':''}>${i+1}개월차 · ${['기초 어휘·문법 정착','LC·RC 유형 학습','650점대 기반 완성','시간 관리 훈련','중급 문제 집중','실전 문제 확대','약점 보완','실전 모의고사 반복','850점 목표 마무리'][i]}</label>`).join('');$('scores').innerHTML=(db.scores||[]).map(s=>`${s.date} · LC ${s.lc} + RC ${s.rc} = <b>${s.lc+s.rc}</b>`).join('<br>')}
$('day').value=new Date().toLocaleDateString('en-CA');$('testdate').value=$('day').value;render();
document.addEventListener('change',e=>{if(e.target.dataset.i!==undefined){let k=key();db.tasks??={};db.tasks[k]??=[];let i=+e.target.dataset.i;db.tasks[k]=e.target.checked?[...new Set([...db.tasks[k],i])]:db.tasks[k].filter(x=>x!==i);save()}if(e.target.dataset.month!==undefined){db.months??=[];let i=+e.target.dataset.month;db.months=e.target.checked?[...new Set([...db.months,i])]:db.months.filter(x=>x!==i);save()}});
$('day').onchange=render;
$('start').onclick=()=>{if(timer)return;running=Date.now();timer=setInterval(()=>{$('clock').textContent=new Date((secs+Math.floor((Date.now()-running)/1000))*1000).toISOString().slice(14,19)},500)};
$('stop').onclick=()=>{if(!timer)return;secs+=Math.floor((Date.now()-running)/1000);clearInterval(timer);timer=null;let mins=Math.max(1,Math.round(secs/60)),s=$('subject').value;db.minutes??={};db.minutes[s]=(db.minutes[s]||0)+mins;secs=0;$('clock').textContent='00:00';save()};
$('saveScore').onclick=()=>{let lc=+$('lc').value,rc=+$('rc').value;if(lc>495||rc>495||!$('testdate').value)return;db.scores??=[];db.scores.push({date:$('testdate').value,lc,rc});save();$('lc').value='';$('rc').value=''};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='toeic850-backup.json';a.click();URL.revokeObjectURL(u)};
$('import').onchange=async e=>{try{db=JSON.parse(await e.target.files[0].text());save();alert('복원 완료')}catch{alert('백업 파일을 확인해 주세요')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
